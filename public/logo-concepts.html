<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111411" />
    <meta name="description" content="Ten identity directions for BunFM." />
    <title>BunFM — Logo directions</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111411;
        color: #f3f1e8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --ground: #111411;
        --surface: #1b201c;
        --ink: #f3f1e8;
        --muted: #a3aaa0;
        --signal: #f1d34f;
        --line: #353b34;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      button { font: inherit; }
      .page { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
      header { padding: 68px 0 50px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; }
      h1 { margin: 0; max-width: 660px; font-size: clamp(42px, 7vw, 88px); line-height: .94; letter-spacing: -.065em; font-weight: 760; }
      header p { margin: 18px 0 0; max-width: 560px; color: var(--muted); font-size: 17px; line-height: 1.55; }
      .selection { color: var(--signal); font-size: 14px; text-align: right; min-width: 150px; }
      .selection strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 7px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-bottom: 72px; }
      .concept { min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: left; padding: 0; cursor: pointer; transition: border-color 160ms ease, transform 160ms ease; }
      .concept:hover { border-color: var(--signal); transform: translateY(-3px); }
      .concept:focus-visible { outline: 3px solid var(--signal); outline-offset: 4px; }
      .concept[aria-pressed="true"] { border: 2px solid var(--signal); }
      .mark-stage { height: 236px; display: grid; place-items: center; background: #202620; overflow: hidden; }
      .mark-stage svg { width: 164px; height: 164px; overflow: visible; }
      .concept:nth-child(3n + 1) .mark-stage { background: #f1d34f; }
      .concept:nth-child(3n + 1) .mark-stage svg { color: #111411; }
      .concept:nth-child(3n + 2) .mark-stage { background: #d9e4dc; }
      .concept:nth-child(3n + 2) .mark-stage svg { color: #14261f; }
      .concept:nth-child(3n) .mark-stage { background: #202620; }
      .concept:nth-child(3n) .mark-stage svg { color: #f1d34f; }
      .concept-copy { padding: 20px 22px 22px; display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: baseline; }
      .concept-copy h2 { margin: 0; font-size: 21px; letter-spacing: -.035em; }
      .concept-copy p { grid-column: 1 / -1; margin: 0; color: var(--muted); line-height: 1.5; font-size: 14px; }
      .wordmark { color: var(--muted); font-size: 13px; letter-spacing: .02em; display: inline-flex; align-items: center; gap: 7px; }
      .wordmark::before { content: ""; display: inline-block; width: 22px; height: 17px; border: 2px solid currentColor; border-radius: 50% 50% 30% 30% / 90% 90% 24% 24%; background: linear-gradient(0deg, currentColor 0 2px, transparent 2px), repeating-linear-gradient(110deg, transparent 0 5px, currentColor 5px 6px); }
      footer { border-top: 1px solid var(--line); padding: 22px 0 36px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 20px; }
      @media (max-width: 700px) {
        .page { width: min(100% - 32px, 520px); }
        header { padding: 48px 0 32px; grid-template-columns: 1fr; }
        .selection { text-align: left; }
        .selection strong { display: inline; margin-right: 10px; }
        .grid { grid-template-columns: 1fr; gap: 12px; padding-bottom: 48px; }
        .mark-stage { height: 205px; }
        .mark-stage svg { width: 148px; height: 148px; }
        footer { flex-direction: column; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div>
          <h1>Ten ways to<br />sound like BunFM.</h1>
          <p>Ten radio-inspired marks, each paired with a clear baozi glyph and FM wordmark. Choose a direction; these are explorations, not changes to the current site.</p>
        </div>
        <div class="selection" aria-live="polite"><strong id="selection-name">No selection yet</strong><span id="selection-hint">Choose a direction below</span></div>
      </header>
      <section class="grid" aria-label="Ten BunFM logo directions">
        <button class="concept" type="button" aria-pressed="false" data-name="01 · On air" aria-label="Select On air logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="B-shaped live signal mark"><path d="M37 27h46c22 0 35 12 35 30 0 13-7 22-18 27 15 4 23 15 23 31 0 22-16 35-42 35H37z" fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="round"/><path d="M62 51h19c10 0 15 5 15 13s-5 13-15 13H62zm0 50h23c11 0 17 5 17 14s-6 14-17 14H62z" fill="currentColor"/><circle cx="35" cy="80" r="7" fill="currentColor"/></svg></div>
          <div class="concept-copy"><h2>On air</h2><span class="wordmark">BunFM</span><p>A sturdy B-shaped broadcast glyph with a live signal at its centre. Direct, legible, and built for tiny app icons.</p></div>
        </button>
        <button class="concept" type="button" aria-pressed="false" data-name="02 · Frequency" aria-label="Select Frequency logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="Soundwave drawn as an F"><path d="M25 35h110M25 80h78M25 125h48" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"/><path d="M25 35v90" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"/><path d="M122 53c12 14 12 40 0 54M137 38c21 24 21 60 0 84" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></div>
          <div class="concept-copy"><h2>Frequency</h2><span class="wordmark">BunFM</span><p>The FM dial becomes a letterform: three tuning marks and a signal curve that carries through from live listening.</p></div>
        </button>
        <button class="concept" type="button" aria-pressed="false" data-name="03 · The station" aria-label="Select The station logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="Compact radio with antenna"><rect x="23" y="48" width="114" height="82" rx="12" fill="none" stroke="currentColor" stroke-width="9"/><path d="m50 46 67-28" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M37 70h52v43H37z" fill="currentColor"/><path d="M101 75h22M101 88h22M101 101h22" stroke="#202620" stroke-width="5" stroke-linecap="round"/><circle cx="111" cy="119" r="4" fill="currentColor"/></svg></div>
          <div class="concept-copy"><h2>The station</h2><span class="wordmark">BunFM</span><p>A pocket radio reduced to its essential silhouette: speaker, tuner, antenna. Familiar hardware with a clean digital footprint.</p></div>
        </button>
        <button class="concept" type="button" aria-pressed="false" data-name="04 · Shared signal" aria-label="Select Shared signal logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="Two arcs meeting at a live point"><circle cx="80" cy="80" r="11" fill="currentColor"/><path d="M49 49a44 44 0 0 0 0 62M111 49a44 44 0 0 1 0 62" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/><path d="M28 28a74 74 0 0 0 0 104M132 28a74 74 0 0 1 0 104" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg></div>
          <div class="concept-copy"><h2>Shared signal</h2><span class="wordmark">BunFM</span><p>Paired radio waves meet at one point: a station made for many listeners, in sync, wherever they tune in.</p></div>
        </button>
        <button class="concept" type="button" aria-pressed="false" data-name="05 · Rotating dial" aria-label="Select Rotating dial logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="Tuning dial with broadcast tick"><circle cx="80" cy="80" r="57" fill="none" stroke="currentColor" stroke-width="10"/><path d="M80 23v14M23 80h14M123 80h14M80 123v14" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><path d="m80 80 32-30" stroke="currentColor" stroke-width="10" stroke-linecap="round"/><circle cx="80" cy="80" r="9" fill="currentColor"/><path d="M55 108h50" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg></div>
          <div class="concept-copy"><h2>Rotating dial</h2><span class="wordmark">BunFM</span><p>A precise tuning dial points to the live frequency. A mechanical, tactile nod to radio without drawing a whole device.</p></div>
        </button>
        <button class="concept" type="button" aria-pressed="false" data-name="06 · Open channel" aria-label="Select Open channel logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="Open circular channel with sound pulse"><path d="M111 35a59 59 0 1 0 14 77" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/><path d="M34 80h23l12-20 20 41 13-21h24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="concept-copy"><h2>Open channel</h2><span class="wordmark">BunFM</span><p>An open ring and uninterrupted waveform suggest a stream that keeps moving, with no start or stop built into the mark.</p></div>
        </button>
        <button class="concept" type="button" aria-pressed="false" data-name="07 · Live bars" aria-label="Select Live bars logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="Four bars form the letter B"><path d="M42 30v100M42 31h42c16 0 25 8 25 22s-9 22-25 22H42m42 0c19 0 30 9 30 27s-11 28-30 28H42" fill="none" stroke="currentColor" stroke-width="13" stroke-linejoin="round"/><path d="M130 39v12M130 109v12" stroke="currentColor" stroke-width="8" stroke-linecap="round"/></svg></div>
          <div class="concept-copy"><h2>Live bars</h2><span class="wordmark">BunFM</span><p>Equalizer bars resolve into a confident B. The audio reference is immediate, while the monogram stays recognisable.</p></div>
        </button>
        <button class="concept" type="button" aria-pressed="false" data-name="08 · Signal flag" aria-label="Select Signal flag logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="Broadcast pennant with nested signals"><path d="M37 27v106M43 34h78L96 60l25 26H43" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M61 48h25M61 61h13M61 74h25" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg></div>
          <div class="concept-copy"><h2>Signal flag</h2><span class="wordmark">BunFM</span><p>A radio pennant signals “you are here.” Its simple geometry can stand alone or pair neatly with the full wordmark.</p></div>
        </button>
        <button class="concept" type="button" aria-pressed="false" data-name="09 · Sound in motion" aria-label="Select Sound in motion logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="Sound waves form a moving note"><path d="M41 54v52M62 39v82M83 55v50M104 69v23" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/><path d="M122 52v50c0 17-12 27-29 27" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><circle cx="83" cy="129" r="8" fill="currentColor"/></svg></div>
          <div class="concept-copy"><h2>Sound in motion</h2><span class="wordmark">BunFM</span><p>Rhythmic bars become a loose musical note. Expressive and warm, with enough structure to survive as a compact mark.</p></div>
        </button>
        <button class="concept" type="button" aria-pressed="false" data-name="10 · The live loop" aria-label="Select The live loop logo direction">
          <div class="mark-stage"><svg viewBox="0 0 160 160" role="img" aria-label="Continuous loop around a broadcast point"><path d="M113 48a48 48 0 1 0 3 61M105 35l12 14-17 7" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="82" r="10" fill="currentColor"/><path d="M54 82a24 24 0 0 1 7-17M102 82a24 24 0 0 1-7 17" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg></div>
          <div class="concept-copy"><h2>The live loop</h2><span class="wordmark">BunFM</span><p>A continuous orbit around the broadcast point captures always-on playback and a community tuning into the same stream.</p></div>
        </button>
      </section>
      <footer><span>BunFM identity explorations</span><span>Select a direction to mark your preference</span></footer>
    </main>
    <script>
      const concepts = [...document.querySelectorAll(".concept")];
      const selectedName = document.getElementById("selection-name");
      const selectedHint = document.getElementById("selection-hint");
      concepts.forEach((concept) => {
        concept.addEventListener("click", () => {
          concepts.forEach((item) => item.setAttribute("aria-pressed", "false"));
          concept.setAttribute("aria-pressed", "true");
          selectedName.textContent = concept.dataset.name;
          selectedHint.textContent = "Selected direction";
        });
      });
    </script>
  </body>
</html>
