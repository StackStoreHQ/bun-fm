<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111411" />
    <meta name="description" content="十款圆面包造型收音机标志：纯图形，无字母。" />
    <title>BunFM — 圆面包收音机标志提案</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --ground: #111411;
        --surface: #1b201c;
        --ink: #f3f1e8;
        --muted: #a3aaa0;
        --signal: #f1d34f;
        background: var(--ground);
        color: var(--ink);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      button { font: inherit; }
      .page { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
      header { padding: 64px 0 44px; display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end; }
      h1 { margin: 0; font-size: clamp(44px, 7vw, 88px); line-height: 1.12; letter-spacing: -.05em; font-weight: 800; }
      header p { margin: 24px 0 0; max-width: 620px; color: var(--muted); font-size: 16px; line-height: 1
.8; }
      .selection { color: var(--signal); font-size: 14px; text-align: right; min-width: 170px; line-height: 1.6; }
      .selection strong { display: block; color: var(--ink); font-size: 19px; margin-bottom: 4px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; padding-bottom: 56px; }
      .concept { --mark-paper: #f1d34f; --mark-ink: #111411; min-width: 0; display: flex; flex-direction: column; border: 0; background: var(--surface); color: var(--ink); text-align: left; padding: 0; cursor: pointer; transition: transform 160ms ease; }
      .concept:hover { transform: translateY(-3px); }
      .concept:focus-visible { outline: 3px solid var(--signal); outline-offset: 5px; }
      .concept[aria-pressed="true"] { outline: 3px solid var(--signal); outline-offset: -3px; }
      .mark-stage { height: 270px; display: grid; place-items: center; background: var(--mark-paper); color: var(--mark-ink); overflow: hidden; }
      .mark-stage svg { width: 264px; height: 220px; max-width: 88%; }
      .concept:nth-child(3n + 2) { --mark-paper: #d9e4dc; --mark-ink: #14261f; }
      .concept:nth-child(3n) { --mark-paper: #202620; --mark-ink: #f1d34f; }
      .concept-copy { padding: 22px 24px 25px; display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: baseline; }
      .concept-title { font-size: 22px; font-weight: 700; }
      .concept-id { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
      .description { grid-column: 1 / -1; color: var(--muted); line-height: 1.8; font-size: 15px; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      footer { padding: 0 0 36px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 20px; line-height: 1.6; }
      @media (max-width: 700px) {
        .page { width: min(calc(100% - 32px), 520px); }
        header { padding: 40px 0 32px; grid-template-columns: 1fr; gap: 20px; }
        .selection { text-align: left; }
        .selection strong { display: inline; margin-right: 10px; }
        .grid { grid-template-columns: 1fr; gap: 16px; padding-bottom: 36px; }
        .mark-stage { height: 242px; }
        .mark-stage svg { width: 252px; height: 210px; }
        .concept-copy { padding: 18px 20px 22px; }
        footer { flex-direction: column; gap: 8px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .concept { transition: none; }
        .concept:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div>
          <h1>圆面包收音机</h1>
          <p>十款圆面包造型的收音机。机身采用平滑、饱满的圆顶，没有尖头、收口或捏褶；保留扬声器、旋钮与天线，不放任何字母。点击喜欢的方案，标记你的选择。</p>
        </div>
        <div class="selection" aria-live="polite" aria-atomic="true">
          <strong id="selection-name">尚未选择</strong>
          <span id="selection-hint">十种造型，往下看一看</span>
        </div>
      </header>
      <h2 id="gallery-title" class="visually-hidden">选择圆面包造型的收音机标志</h2>
      <section class="grid" aria-labelledby="gallery-title">
        <button class="concept" type="button" aria-pressed="false" data-name="01 · 经典便携" aria-label="选择方案 01：经典便携">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="圆面包机身、圆扬声器、调频旋钮与斜天线组成的便携收音机">
              <g data-part="round-bread" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M44 121C44 79 77 49 120 49C163 49 196 79 196 121C196 153 167 167 120 167C73 167 44 153 44 121Z" stroke-width="7" />
                <path d="M101 70L99 75M120 63L122 68M141 71L139 76" stroke-width="3" />
              </g>
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M156 61L180 24" stroke-width="6" />
                <circle cx="94" cy="121" r="25" stroke-width="6" />
                <circle cx="94" cy="121" r="12" stroke-width="4" />
                <path d="M137 103H169M143 96V110M137 117H158" stroke-width="4" />
                <circle cx="153" cy="137" r="11" stroke-width="5" />
                <path d="M153 137L158 132" stroke-width="3" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">经典便携</strong><span class="concept-id">方案 01</span><span class="description">圆面包就是机身。左侧扬声器、右侧旋钮与斜天线，保留最典型的便携收音机结构。</span></span>
        </button>

        <button class="concept" type="button" aria-pressed="false" data-name="02 · 双声道小包" aria-label="选择方案 02：双声道小包">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="宽圆面包机身带有两个扬声器及中央调频窗">
              <g data-part="round-bread" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M33 124C33 83 69 53 120 53C171 53 207 83 207 124C207 154 177 168 120 168C63 168 33 154 33 124Z" stroke-width="7" />
                <path d="M101 73L99 78M119 67L121 72M140 74L138 79" stroke-width="3" />
              </g>
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M75 67L53 28" stroke-width="5" />
                <circle cx="77" cy="125" r="24" stroke-width="6" />
                <circle cx="163" cy="125" r="24" stroke-width="6" />
                <circle cx="77" cy="125" r="9" stroke-width="4" />
                <circle cx="163" cy="125" r="9" stroke-width="4" />
                <rect x="101" y="91" width="38" height="13" rx="4" stroke-width="4" />
                <path d="M118 94V101M116 127H124M116 141H124" stroke-width="4" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">双声道小包</strong><span class="concept-id">方案 02</span><span class="description">把老式双喇叭收录机揉成一只扁圆面包。左右对称，中央留出小小的调频窗。</span></span>
        </button>

        <button class="concept" type="button" aria-pressed="false" data-name="03 · 复古调频" aria-label="选择方案 03：复古调频">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="圆面包外形的复古收音机，具有横向调频窗和百叶扬声器">
              <g data-part="round-bread" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M43 120C43 78 77 47 120 47C163 47 197 78 197 120C197 153 169 170 120 170C71 170 43 153 43 120Z" stroke-width="7" />
              </g>
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M155 56L185 26" stroke-width="5" />
                <rect x="76" y="86" width="89" height="16" rx="4" stroke-width="5" />
                <path d="M91 90V97M108 90V97M132 89V99M150 90V97M73 116H117M71 128H119M76 140H114" stroke-width="4" />
                <circle cx="150" cy="127" r="15" stroke-width="5" />
                <path d="M150 127L156 121" stroke-width="4" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">复古调频</strong><span class="concept-id">方案 03</span><span class="description">长条调频刻度、横向声栅与大旋钮，放进软乎乎的圆面包轮廓。更接近老收音机的记忆。</span></span>
        </button>

        <button class="concept" type="button" aria-pressed="false" data-name="04 · 极简剪影" aria-label="选择方案 04：极简剪影">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="实心圆面包收音机剪影，以留白表现扬声器和两个旋钮">
              <g data-part="round-bread">
                <path d="M41 121C41 78 75 48 120 48C165 48 199 78 199 121C199 154 170 172 120 172C70 172 41 154 41 121Z" fill="currentColor" />
              </g>
              <g data-part="radio">
                <path d="M157 62L179 24" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
                <circle cx="94" cy="124" r="25" fill="var(--mark-paper)" />
                <circle cx="94" cy="124" r="12" fill="currentColor" />
                <circle cx="153" cy="114" r="10" fill="var(--mark-paper)" />
                <circle cx="153" cy="143" r="6" fill="var(--mark-paper)" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">极简剪影</strong><span class="concept-id">方案 04</span><span class="description">整块圆面包剪影中挖出扬声器与旋钮，删去细小刻度。图形更结实，偏小尺寸图标方向。</span></span>
        </button>

        <button class="concept" type="button" aria-pressed="false" data-name="05 · 提手小包" aria-label="选择方案 05：提手小包">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="带便携提手、扬声器和旋钮的圆面包造型收音机">
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M74 97V48Q74 33 89 33H151Q166 33 166 48V97M161 35L183 17" stroke-width="6" />
              </g>
              <g data-part="round-bread" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M47 127C47 94 79 72 120 72C161 72 193 94 193 127C193 156 165 170 120 170C75 170 47 156 47 127Z" fill="var(--mark-paper)" stroke-width="7" />
                <path d="M101 89L99 93M120 84L122 88M140 90L138 94" fill="none" stroke-width="3" />
              </g>
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="94" cy="132" r="22" stroke-width="6" />
                <path d="M84 119V145M94 116V148M104 119V145M135 112H164M149 108V116" stroke-width="4" />
                <circle cx="142" cy="140" r="7" stroke-width="4" />
                <circle cx="165" cy="140" r="7" stroke-width="4" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">提手小包</strong><span class="concept-id">方案 05</span><span class="description">圆面包的平滑圆顶后方加上便携提手，点缀几粒芝麻。像一台可以拎走的小电台，生活感更强。</span></span>
        </button>

        <button class="concept" type="button" aria-pressed="false" data-name="06 · 百叶声栅" aria-label="选择方案 06：百叶声栅">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="圆面包机身以竖向百叶扬声器为主体，下方带有两个调节旋钮">
              <g data-part="round-bread" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M44 120C44 78 77 48 120 48C163 48 196 78 196 120C196 153 168 170 120 170C72 170 44 153 44 120Z" stroke-width="7" />
              </g>
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M75 62L54 26M77 105V126M91 96V134M105 92V138M119 92V138M133 92V138M147 96V134M161 105V126" stroke-width="6" />
                <circle cx="106" cy="153" r="5" stroke-width="3" />
                <circle cx="135" cy="153" r="5" stroke-width="3" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">百叶声栅</strong><span class="concept-id">方案 06</span><span class="description">用一整面竖向声栅代替圆喇叭，随圆面包轮廓由短到长排列。视觉更有秩序，也更偏现代电器。</span></span>
        </button>

        <button class="concept" type="button" aria-pressed="false" data-name="07 · 电波圆包" aria-label="选择方案 07：电波圆包">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="圆面包机身连接直立广播天线，机身上有扬声器与调频器">
              <g data-part="round-bread" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M56 131C56 99 84 77 120 77C156 77 184 99 184 131C184 157 160 172 120 172C80 172 56 157 56 131Z" stroke-width="7" />
              </g>
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M120 77V39M99 22Q82 39 99 56M141 22Q158 39 141 56M86 10Q58 39 86 68M154 10Q182 39 154 68" stroke-width="5" />
                <circle cx="120" cy="33" r="6" fill="currentColor" stroke="none" />
                <circle cx="101" cy="131" r="20" stroke-width="6" />
                <circle cx="101" cy="131" r="7" stroke-width="3" />
                <path d="M145 111V149M138 123H152" stroke-width="5" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">电波圆包</strong><span class="concept-id">方案 07</span><span class="description">从光滑的圆面包机身接出广播天线，电波向外扩散。机身保留喇叭与调频滑杆，轮廓圆润简洁。</span></span>
        </button>

        <button class="concept" type="button" aria-pressed="false" data-name="08 · 圆盘小电台" aria-label="选择方案 08：圆盘小电台">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="圆面包形收音机以同心圆扬声器为主，两侧带小型控制部件">
              <g data-part="round-bread" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M48 117C48 77 79 47 120 47C161 47 192 77 192 117C192 153 165 172 120 172C75 172 48 153 48 117Z" stroke-width="7" />
              </g>
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M158 60L181 23" stroke-width="5" />
                <circle cx="120" cy="119" r="33" stroke-width="6" />
                <circle cx="120" cy="119" r="22" stroke-width="4" />
                <circle cx="120" cy="119" r="7" fill="currentColor" stroke="none" />
                <circle cx="171" cy="112" r="6" stroke-width="3" />
                <path d="M170 134V140M68 109V130" stroke-width="5" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">圆盘小电台</strong><span class="concept-id">方案 08</span><span class="description">一只大圆扬声器占据圆面包正面，小旋钮退到侧边。图形中心明确，偏圆润、克制的现代造型。</span></span>
        </button>

        <button class="concept" type="button" aria-pressed="false" data-name="09 · 面包篮底座" aria-label="选择方案 09：面包篮底座">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="装有扬声器与旋钮的圆面包收音机，坐在面包篮底座上">
              <g data-part="round-bread" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M78 149C61 142 52 127 52 108C52 72 81 47 120 47C159 47 188 72 188 108C188 127 179 142 162 149" stroke-width="7" />
                <path d="M48 141Q120 160 192 141L188 162Q120 186 52 162ZM68 150V163M85 154V168M155 154V168M172 150V163" stroke-width="4" />
              </g>
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M159 57L183 23" stroke-width="5" />
                <circle cx="99" cy="109" r="22" stroke-width="6" />
                <path d="M87 102H111M85 111H113M90 120H108M137 91H162M149 87V95" stroke-width="4" />
                <circle cx="150" cy="119" r="11" stroke-width="5" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">面包篮底座</strong><span class="concept-id">方案 09</span><span class="description">圆面包本身是一台收音机，面包篮成为机座。圆滑机身配上编织底座，适合偏生活化的品牌。</span></span>
        </button>

        <button class="concept" type="button" aria-pressed="false" data-name="10 · 笑脸电台" aria-label="选择方案 10：笑脸电台">
          <span class="mark-stage">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="圆面包收音机的扬声器与旋钮构成双眼，弧形调频窗像微笑">
              <g data-part="round-bread" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M44 121C44 80 77 50 120 50C163 50 196 80 196 121C196 154 167 173 120 173C73 173 44 154 44 121Z" stroke-width="7" />
                <path d="M100 72L98 76M120 65L122 69M141 73L139 77" stroke-width="3" />
              </g>
              <g data-part="radio" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M76 66L55 27" stroke-width="5" />
                <circle cx="91" cy="113" r="19" stroke-width="5" />
                <path d="M83 101V125M91 98V128M99 101V125" stroke-width="3" />
                <circle cx="151" cy="113" r="13" stroke-width="5" />
                <path d="M151 113L156 108M94 145Q120 160 146 145M107 149L105 154M120 151V157M133 149L135 154" stroke-width="4" />
              </g>
            </svg>
          </span>
          <span class="concept-copy"><strong class="concept-title">笑脸电台</strong><span class="concept-id">方案 10</span><span class="description">扬声器与旋钮自然变成一双眼睛，弧形调频窗像微笑。仍是一台收音机，但多了一点圆面包角色感。</span></span>
        </button>
      </section>
      <footer><span>BunFM · 圆面包收音机造型探索</span><span>方案 03「复古调频」已采用为正式图标</span></footer>
    </main>
    <script>
      const concepts = [...document.querySelectorAll(".concept")];
      const selectedName = document.getElementById("selection-name");
      const selectedHint = document.getElementById("selection-hint");
      concepts.forEach((concept) => {
        concept.addEventListener("click", () => {
          concepts.forEach((item) => item.setAttribute("aria-pressed", "false"));
          concept.setAttribute("aria-pressed", "true");
          selectedName.textContent = concept.dataset.name;
          selectedHint.textContent = "已标记，可以继续比较其他方案";
        });
      });
    </script>
  </body>
</html>
