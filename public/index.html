<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Listen live on BunFM." />
    <title>BunFM — Live radio</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/player.css" />
    <script src="/player.js" defer></script>
    <script src="/pwa.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to player</a>
    <div class="atmosphere" aria-hidden="true">
      <img id="background-cover" src="/icon.jpg" alt="" />
    </div>
    <div class="shell">
      <header class="station">
        <h1 id="site-title">BunFM</h1>
        <p id="site-description">A place to listen. Live, together.</p>
        <nav id="share-actions" class="share-actions" aria-label="Share station" hidden>
          <a id="share-x" class="share-action" target="_blank"
            rel="noopener noreferrer" aria-label="Share on X" title="Share on X">
            <svg viewBox="0 0 24 24" width="20" height="20"
              aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.9-9L.8 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20Z" />
            </svg>
          </a>

          <button id="share-copy" class="share-action" type="button"
            aria-label="Copy station link" title="Copy station link">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="m10 13 4-4M8 16l-1 1a4.2 4.2 0 0 1-6-6l4-4a4.2 4.2 0 0 1 6 0m2 1 1-1a4.2 4.2 0 0 1 6 6l-4 4a4.2 4.2 0 0 1-6 0" transform="translate(1 0)" />
            </svg>
          </button>
          <button id="share-more" class="share-action" type="button"
            aria-label="More sharing options" title="More sharing options">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M12 16V3m-5 5 5-5 5 5M5 13v7h14v-7" />
            </svg>
          </button>
        </nav>
        <div class="share-feedback">
          <p id="share-status" role="status" aria-atomic="true"></p>
          <div id="share-fallback" class="share-fallback" hidden>
            <label for="share-url">Station link — select and copy</label>
            <div class="share-fallback-controls">
              <input id="share-url" type="url" readonly spellcheck="false" />
              <button id="share-close" type="button">Close</button>
            </div>
          </div>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <section class="listening-room" aria-labelledby="track-title">
          <div class="artwork">
            <img
              id="cover"
              src="/icon.jpg"
              alt="BunFM station artwork"
              width="480"
              height="480"
              fetchpriority="high"
            />
          </div>
          <div class="track-content">
            <div class="track-details" aria-live="polite" aria-atomic="true">
              <h2 id="track-title">Live radio</h2>
              <p id="track-artist" class="artist">Waiting for the current track</p>
              <p id="track-album" class="album" hidden></p>
            </div>

            <div class="playback">
              <button
                id="play-toggle"
                class="play-toggle"
                type="button"
                aria-label="Play live stream"
                aria-describedby="playback-status playback-hint"
                disabled
              >
                <svg
                  id="play-icon"
                  viewBox="0 0 32 32"
                  width="30"
                  height="30"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M11 6.5 26 16 11 25.5Z" fill="currentColor" />
                </svg>
                <svg
                  id="pause-icon"
                  viewBox="0 0 32 32"
                  width="30"
                  height="30"
                  aria-hidden="true"
                  focusable="false"
                  hidden
                >
                  <path d="M8 7h6v18H8zM19 7h6v18h-6z" fill="currentColor" />
                </svg>
                <svg
                  id="loading-icon"
                  class="loading-icon"
                  viewBox="0 0 32 32"
                  width="30"
                  height="30"
                  aria-hidden="true"
                  focusable="false"
                  hidden
                >
                  <circle cx="16" cy="16" r="11" fill="none"
                    stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" stroke-dasharray="48 22" />
                </svg>
              </button>
              <div id="spectrum-area" class="spectrum-area">
                <canvas
                  id="spectrum"
                  width="560"
                  height="96"
                  role="img"
                  aria-label="Live audio frequency spectrum"
                ></canvas>
              </div>
              <div class="visually-hidden" role="status" aria-atomic="true">
                <p id="playback-status">Paused</p>
                <p id="playback-hint" class="playback-hint">
                  Press play to join the live stream
                </p>
              </div>
            </div>

            <p id="spectrum-note" class="visually-hidden" hidden></p>
            <noscript>
              <p>Enable JavaScript to use the player.</p>
            </noscript>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <a
          id="project-link"
          href="https://github.com/StackStoreHQ/bun-fm"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="BunFM on GitHub"
        >
          BunFM v<span id="app-version">…</span>
        </a>
        <div class="service-stats" aria-label="Service statistics">
          <span id="service-uptime" title="Time since the service started">Up —</span>
          <span id="service-visits" title="Player page views since the first visit">Visits —</span>
          <span id="service-listens" title="Total live stream connections">Listens —</span>
          <span id="service-online" title="Active live stream connections">Online —</span>
        </div>
      </footer>
    </div>
    <audio id="audio" preload="none" hidden></audio>
  </body>
</html>
